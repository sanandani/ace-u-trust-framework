name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: python eval/run.py
  oracle-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Apply schema, audit policy, and smoke query on Oracle Free
        env:
          ORACLE_USER: aceu
          ORACLE_PASSWORD: synthetic_ci_only
          ORACLE_DSN: localhost:1521/FREEPDB1
          ORACLE_ADMIN_PASSWORD: synthetic_ci_only
        run: ./scripts/verify_oracle.sh
